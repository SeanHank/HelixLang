[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helixlang"
version = "2026.8.5"
description = "A domain-specific language where biological genetic material is the source, binary bytecode is the intermediate representation, and the execution semantics simulate biological behavior."
readme = "README_PYPI.md"
requires-python = ">=3.11,<3.12"
authors = [{name = "Sean Hank"}]
license = "AGPL-3.0-only"
keywords = ["DSL", "DNA", "compiler", "artificial-life", "biological-simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "pytest-cov>=4.1,<6", "scipy>=1.12,<2", "pytest-benchmark>=4.0,<5", "pytest-xdist>=3.5,<4"]
fast = ["numpy>=1.26,<3"]
viz = ["matplotlib>=3.8,<4"]
web = ["flask>=3.0,<4"]   # Web visualization frontend: python -m helixlang --serve
bio = ["biopython>=1.83,<2", "reedsolo>=1.7,<2", "cobra>=0.26,<1"]   # Physical DNA codec + IUPAC validation + genome-scale metabolic models
ml = ["esm>=2.0", "torch>=2.0"]   # Protein structure prediction + sequence-based kinetics (doc/26 Phase B-C)
human = ["rdkit>=2026.3,<2027"]   # SMILES parsing + molecular properties for human drug simulation (doc/27)

[project.scripts]
helixlang = "helixlang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helixlang = ["data/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["helixlang"]
branch = true
omit = [
    "*/__main__.py",
    "*/tests/*",
]

[tool.coverage.report]
# Coverage gate: CI relies on this config as the lower-bound reference for --cov-fail-under=80.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

