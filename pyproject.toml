[build-system]
requires = ["setuptools>=68", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helixlang"
version = "2026.9.0"
description = "A domain-specific language where biological genetic material is the source, binary bytecode is the intermediate representation, and the execution semantics simulate biological behavior."
readme = "README_PYPI.md"
requires-python = ">=3.11,<3.12"
authors = [{name = "Sean Hank"}]
license = { text = "AGPL-3.0-only" }
keywords = ["DSL", "DNA", "compiler", "artificial-life", "biological-simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
# ---- dev / tooling ----
dev = ["pytest>=7.4,<9", "pytest-cov>=4.1,<6", "scipy>=1.12,<2", "pytest-benchmark>=4.0,<5", "pytest-xdist>=3.5,<4"]
# ---- lightweight, pure-Python/numpy acceleration (backward-compat alias) ----
fast = ["numpy>=1.26,<3"]
# ---- JAX BatchRuntime (doc/39 O11): optional GPU/TPU backend engine. Absence
#      is NOT an error — the batch runtime transparently falls back to numpy
#      (device availability is a *performance* property, never a *fidelity* one,
#      doc/37 §3). Install with: pip install helixlang[has_jax] ----
has_jax = ["jax>=0.4,<1"]
# ---- backend group: per-plugin extra == canonical module name (doc/36 §3.4) ----
grn = ["numpy>=1.26,<3"]
fba = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
pk = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
disease = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
annotation = ["numpy>=1.26,<3", "biopython>=1.83,<2", "reedsolo>=1.7,<2"]
gem = ["numpy>=1.26,<3", "cobra>=0.26,<1"]
human = ["numpy>=1.26,<3", "scipy>=1.12,<2", "rdkit>=2026.3,<2027"]
# ---- Bayesian patient calibration (doc/40 Phase H): HMC/NUTS via pymc with an
#      emcee ensemble-sampler alternative. Both are DECLARED dependencies (no silent
#      fallback, directive): the backend is chosen explicitly. matplotlib is pinned
#      <3.11 because arviz_plots 0.8.0 uses the deprecated matplotlib.style.core
#      unconditionally, which raises AttributeError under matplotlib 3.11 and breaks
#      `import pymc`. Runtime python: /opt/anaconda3/envs/helix/bin/python.
#      Install with: pip install helixlang[bayes] ----
bayes = ["pymc>=5.28,<6", "arviz>=0.23,<0.24", "emcee>=3.1,<4", "matplotlib>=3.8,<3.11", "scipy>=1.12,<2"]
apps = ["numpy>=1.26,<3", "matplotlib>=3.8,<4"]
# ---- misc capability groups (kept for backward compatibility) ----
viz = ["matplotlib>=3.8,<4"]
web = ["flask>=3.0,<4"]   # Web visualization frontend: python -m helixlang --serve
bio = ["biopython>=1.83,<2", "reedsolo>=1.7,<2", "cobra>=0.26,<1"]   # Physical DNA codec + IUPAC validation + genome-scale metabolic models
ml = ["numpy>=1.26,<3", "esm>=2.0", "torch>=2.0"]   # Protein structure prediction + sequence-based kinetics (doc/26 Phase B-C)
# ---- everything ----
all = ["helixlang[grn,fba,pk,disease,annotation,gem,human,bayes,apps,web,ml]"]
# ---- CI test surface (GitHub Actions installs this in ONE expression) ----
# dev tooling + every optional backend the test-suite and typecheck gates
# exercise, including the Bayesian samplers (pymc/emcee) and the opt-in
# ``has_jax`` backend.  JAX is deliberately NOT part of ``all`` (a plain
# ``pip install .[all]`` stays JAX-free), so the extra pins it explicitly.
ci = ["helixlang[all]", "helixlang[dev]", "jax>=0.4,<1"]
# Native builds (Cython/C). `native` is built-at-install when the toolchain
# exists; otherwise the pure-Python/numpy path is used automatically.
native = ["cython>=3.0", "setuptools>=68", "wheel", "build"]

[project.scripts]
helixlang = "helixlang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helixlang = ["data/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["helixlang"]
branch = true
omit = [
    "*/__main__.py",
    "*/tests/*",
]

[tool.coverage.report]
# Coverage gate: CI relies on this config as the lower-bound reference for --cov-fail-under=80.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

