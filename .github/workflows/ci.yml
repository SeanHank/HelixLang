name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff check (src + tests)
        run: ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy + project (with optional dependencies to resolve stubs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast,web,bio,ml]"
          pip install mypy
      - name: Mypy type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (including [bio] and [ml] extras)
        run: |
          python -m pip install --upgrade pip
          # Install all optional dependencies: dev (tests + coverage + xdist) / fast (numpy) / web (flask) / bio (biopython + reedsolo + cobra) / ml (esm + torch)
          pip install -e ".[dev,fast,web,bio,ml]"

      - name: Run tests with coverage (gate 80%)
        run: |
          pytest --cov=helixlang --cov-report=term-missing --cov-fail-under=80 --tb=short

  examples-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (with [bio] and [ml] extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast,web,bio,ml]"
      - name: Examples smoke test (all *.helix compile and run)
        run: |
          # Compile all examples
          for f in examples/*.helix; do
            echo "=== compile $f ==="
            python -m helixlang "$f" --disassemble >/dev/null \
              || { echo "COMPILE FAIL: $f"; exit 1; }
          done
          # Run the minimal example
          python -m helixlang examples/01_hello_dna.helix
