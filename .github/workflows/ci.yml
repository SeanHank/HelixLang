name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Manual release: a human dispatches this workflow after the push-triggered
  # tests have passed.  The release job (last step) only runs for the manual
  # trigger and depends on every gate in this same run.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 2026.9.1) — must match pyproject.toml"
        required: true
        type: string

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff check (src + tests)
        run: ruff check src tests

  silent-fallbacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project (core only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Silent-fallback lint — core foundation (hard gate)
        run: |
          # audited core + _accel must stay clean (doc/36 §3ξ.4)
          python -m helixlang.core.find_silent_fallbacks \
            src/helixlang/core src/helixlang/_accel --fail
      - name: Silent-fallback audit — full tree (hard gate)
        run: |
          # Phase 5 item 4: the entire tree must be clean.  Genuinely benign
          # capability/cache/parse probes carry an explicit `# noqa:
          # SILENTBENIGN` marker and are excluded by the linter; anything that
          # still matches is an actionable silent fallback and fails CI.
          python -m helixlang.core.find_silent_fallbacks src --fail

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy + project (with all optional dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast,web,bio,ml,viz,human]"
          pip install mypy
      - name: Mypy type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast,web,bio,ml,viz,human]"

      - name: Run tests with coverage
        run: |
          pytest --cov=helixlang --cov-report=term-missing --cov-fail-under=80

  examples-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast,web,bio,ml,viz,human]"
      - name: Examples smoke test (all *.helix compile and run)
        run: |
          # Compile all examples
          for f in examples/*.helix; do
            echo "=== compile $f ==="
            python -m helixlang "$f" --disassemble >/dev/null \
              || { echo "COMPILE FAIL: $f"; exit 1; }
          done
          # Run the minimal example
          python -m helixlang examples/01_hello_dna.helix

  # ─── Cross-platform dual-wheel packaging (py + native), doc/36 Phase 4 item 2:
  # builds on every runner OS so the GitHub Release ships Linux + macOS (arm64
  # and x86_64) + Windows native wheels alongside the pure-Python wheel. ──────
  build-wheels:
    name: build-wheels (${{ matrix.osname }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            osname: linux
          - os: macos-14
            osname: macos-arm64
          - os: macos-13
            osname: macos-x86_64
          - os: windows-latest
            osname: windows
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools + Cython
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel cython
      - name: Build pure-Python wheel
        if: matrix.osname == 'linux'
        run: python -m build --wheel
      - name: Build native wheel (HELIX_BUILD_NATIVE=1)
        run: |
          # Cython is in [build-system].requires, so the isolated build env
          # provides it — no --no-isolation needed (doc/36 §4.2.1).
          python -m build --wheel
        env:
          HELIX_BUILD_NATIVE: "1"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.osname }}
          path: dist/

  # ─── Release (manual only, after all gates above pass) ─────────────────────
  release:
    name: Build & Publish Release
    if: github.event_name == 'workflow_dispatch'
    needs: [lint, silent-fallbacks, typecheck, test, examples-smoke, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Resolve version from input
        id: version
        run: |
          echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$ ]]; then
            echo "ERROR: invalid version format: $VERSION"
            exit 1
          fi
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "$PKG_VER" ]; then
            echo "ERROR: input ($VERSION) != pyproject.toml version ($PKG_VER)"
            exit 1
          fi
          INIT_VER=$(python -c "exec(open('src/helixlang/__init__.py').read()); print(__version__)")
          if [ "$VERSION" != "$INIT_VER" ]; then
            echo "ERROR: input ($VERSION) != __init__.py version ($INIT_VER)"
            exit 1
          fi
          echo "Version verified: $VERSION"

      - name: Build sdist
        run: python -m build --sdist

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          git tag -f "$TAG"
          git push origin "$TAG" -f

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          echo "HelixLang ${VERSION}" > /tmp/release-notes.md
          # Delete existing release if re-triggering
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "HelixLang ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --latest