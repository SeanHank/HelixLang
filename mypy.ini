[mypy]
python_version = 3.11
files = src/helixlang
exclude = tests/
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
ignore_missing_imports = True
# Tighten: check the bodies of unannotated functions and require function annotations (view functions exempted below)
check_untyped_defs = True
disallow_untyped_defs = True

# Flask view functions (route handlers) are invoked by framework conventions and return Response;
# Annotating all 47 handlers individually yields little benefit, so only this module is exempted from disallow_untyped_defs,
# while their bodies still undergo check_untyped_defs.
[mypy-helixlang.server.app]
disallow_untyped_defs = False

# RDKit stubs are present in CI but not locally; type: ignore[attr-defined]
# comments are needed locally but unused in CI — suppress the warning here.
[mypy-helixlang.plugins.human.drug]
warn_unused_ignores = False

[mypy-helixlang.plugins.human.molecular_toxicity]
warn_unused_ignores = False

[mypy-helixlang.plugins.human.proteome_binding]
warn_unused_ignores = False

# _accel hot-loop kernels are deliberately untyped: they accept lists/arrays and
# are matched one-for-one by compiled backends (C/Cython/Rust, doc/36 §5). Full
# function annotations here would be rewritten every time an impl is swapped.
[mypy-helixlang._accel.*]
disallow_untyped_defs = False
