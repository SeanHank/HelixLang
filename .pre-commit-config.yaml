repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
        args: [--fix]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      # doc/36 §3ξ.4: no silent fallbacks. Enforced on the audited core + _accel
      # foundation (clean by construction); scoped here so the quality gate stays
      # green while the legacy scientific modules migrate to plugins (Phase 2/4).
      - id: find-silent-fallbacks-core
        name: find silent fallbacks (core)
        entry: python -m helixlang.core.find_silent_fallbacks src/helixlang/core src/helixlang/_accel --fail
        language: system
        types: [python]
        pass_filenames: false
      # Documentation reality gate: every doc/ statement must describe shipped,
      # wired behavior (planned/proposed/deferred/blocked/out-of-scope/partial/
      # pending/roadmap wording fails).  Benign exceptional lines carry an
      # explicit `DOCBENIGN` token (see src/helixlang/core/audit_docs.py).
      - id: audit-docs
        name: audit docs (shipped-behavior gate)
        entry: python -m helixlang.core.audit_docs doc --fail
        language: system
        pass_filenames: false
